# Dependencias locales: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: infopresupuestal
      POSTGRES_USER: infopresupuestal
      POSTGRES_PASSWORD: infopresupuestal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
